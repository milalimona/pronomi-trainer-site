:root {
  --ink: #24212b;
  --muted: #6f6878;
  --line: rgba(70, 61, 92, 0.16);
  --paper: rgba(255, 253, 250, 0.72);
  --paper-strong: rgba(255, 253, 250, 0.9);
  --blue: #bfd3fb;
  --rose: #ffd6e4;
  --peach: #ffe0c8;
  --mint: #c9ecd9;
  --violet: #ded7ff;
  --good: #237c67;
  --bad: #c8425b;
  --shadow: 0 24px 80px rgba(52, 47, 67, 0.12);
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: "Montserrat", Arial, sans-serif;
  background:
    radial-gradient(circle at 11% 7%, rgba(164, 190, 237, 0.72), transparent 32%),
    radial-gradient(circle at 85% 6%, rgba(255, 190, 211, 0.68), transparent 35%),
    radial-gradient(circle at 48% 92%, rgba(255, 221, 191, 0.72), transparent 38%),
    radial-gradient(circle at 93% 86%, rgba(205, 235, 214, 0.58), transparent 30%),
    linear-gradient(135deg, #fffaf7 0%, #f8f4ef 100%);
}

body::before,
body::after {
  content: "";
  position: fixed;
  pointer-events: none;
  border: 1px solid rgba(255, 255, 255, 0.78);
  transform: rotate(-8deg);
  opacity: 0.5;
}

body::before {
  width: 360px;
  height: 120px;
  border-radius: 50%;
  left: 42%;
  top: 9%;
}

body::after {
  width: 210px;
  height: 210px;
  right: 7%;
  bottom: 8%;
  border-radius: 50%;
}

button,
input {
  font: inherit;
}

.app {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 38px 0 48px;
}

.hero {
  min-height: 220px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 28px;
  align-items: end;
}

.eyebrow,
.tag,
.stats small {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

h1,
h2 {
  margin: 0;
  font-family: "Belgan Aesthetic", Georgia, serif;
  font-weight: 400;
  letter-spacing: 0;
}

h1 {
  max-width: 860px;
  font-size: clamp(54px, 9vw, 108px);
  line-height: 0.9;
}

.lead {
  width: min(660px, 100%);
  margin: 28px 0 0;
  font-size: 19px;
  line-height: 1.45;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);

const state = {
  index: 0,
  score: 0,
  streak: 0,
  locked: false,
  answers: Array(questions.length).fill(null),
  optionOrders: Array(questions.length).fill(null)
};

const els = {
  counter: document.querySelector("#counter"),
  score: document.querySelector("#score"),
  streak: document.querySelector("#streak"),
  progress: document.querySelector("#progress"),
  topic: document.querySelector("#topic"),
  level: document.querySelector("#level"),
  lineA: document.querySelector("#lineA"),
  lineB: document.querySelector("#lineB"),
  prompt: document.querySelector("#prompt"),
  options: document.querySelector("#options"),
  form: document.querySelector("#answerForm"),
  input: document.querySelector("#textAnswer"),
  check: document.querySelector("#check"),
  feedback: document.querySelector("#feedback"),
  prev: document.querySelector("#prev"),
  next: document.querySelector("#next"),
  restart: document.querySelector("#restart"),
  summary: document.querySelector("#summary"),
  resultText: document.querySelector("#resultText"),
  retry: document.querySelector("#retry")
};

function normalize(value) {
  return value
    .trim()
    .toLowerCase()
    .replace(/[’]/g, "'")
    .replace(/\be'/g, "e")
    .replace(/([aeiou])'/g, "$1")
    .replace(/[è]/g, "e")
    .replace(/[à]/g, "a")
    .replace(/[ù]/g, "u")
    .replace(/[“”"«»]/g, "")
    .replace(/\s+/g, " ")
    .replace(/[.,;:!?]/g, "");
}

function acceptedAnswers(q) {
  return (q.accepted || [q.answer]).map(normalize);
}

function updateStats() {
  state.score = state.answers.filter((answer) => answer?.isCorrect).length;
  let streak = 0;
  const lastAnsweredIndex = state.answers.reduce((last, answer, index) => (answer ? index : last), -1);
  for (let i = 0; i <= lastAnsweredIndex; i += 1) {
    streak = state.answers[i]?.isCorrect ? streak + 1 : 0;
  }
  state.streak = streak;
  els.score.textContent = state.score;
  els.streak.textContent = state.streak;
}

function resetQuestionSurface() {
  els.options.innerHTML = "";
  els.form.hidden = true;
  els.input.classList.remove("wrong");
  els.input.disabled = false;
  els.input.value = "";
  els.input.placeholder = "ответ";
  els.check.disabled = false;
  els.feedback.hidden = true;
  els.feedback.className = "feedback";
  els.feedback.textContent = "";
}

function render() {
  const q = questions[state.index];
  const saved = state.answers[state.index];
  state.locked = Boolean(saved);

  els.counter.textContent = `${state.index + 1} / ${questions.length}`;
  els.progress.style.width = `${((state.index + 1) / questions.length) * 100}%`;
  els.topic.textContent = q.topic;
  els.level.textContent = "A1";
  els.lineA.textContent = q.lineA;
  els.lineB.textContent = q.lineB;
  els.prompt.hidden = true;
  els.prompt.textContent = "";
  els.prev.disabled = state.index === 0;
  els.next.disabled = !saved;
  els.next.textContent = state.index === questions.length - 1 ? "показать итог" : "следующий";
  els.summary.hidden = true;
  resetQuestionSurface();
  updateStats();

  if (q.type === "choice") renderChoice(q, saved);
  if (q.type === "input" || q.type === "ending") renderInput(q, saved);
  if (q.type === "puzzle") renderPuzzle(q, saved);
  if (saved) showSavedFeedback(q, saved);
}

function getChoiceOptions(q, saved) {
  if (saved?.options) return saved.options;
  if (state.optionOrders[state.index]) return state.optionOrders[state.index];
  const options = [...new Set(q.options)];
  for (let i = options.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  state.optionOrders[state.index] = options;
  return options;
}

function renderChoice(q, saved) {
  getChoiceOptions(q, saved).forEach((option) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";
    button.textContent = option;
    button.disabled = Boolean(saved);
    if (saved) {
      if (option === q.answer) button.classList.add("correct");
      if (option === saved.value && !saved.isCorrect) button.classList.add("wrong");
    }
    button.addEventListener("click", () => {
      if (state.locked) return;
      saveAnswer(option, option === q.answer, { options: getChoiceOptions(q) });
    });
    els.options.appendChild(button);
  });
}

function renderInput(q, saved) {
  els.form.hidden = false;
  els.input.placeholder = q.placeholder || "ответ";
  if (saved) {
    els.input.value = saved.value;
    els.input.disabled = true;
    els.check.disabled = true;
    if (!saved.isCorrect) els.input.classList.add("wrong");
    return;
  }
  window.setTimeout(() => els.input.focus(), 0);
}

function renderPuzzle(q, saved) {
  const puzzle = document.createElement("div");
  puzzle.className = "puzzle";
  const line = document.createElement("div");
  line.className = "puzzle-line";

  q.answerSlots.forEach((_, index) => {
    line.append(document.createTextNode(q.pattern[index]));
    const slot = document.createElement("button");
    slot.type = "button";
    slot.className = "slot";
    slot.dataset.slot = String(index);
    slot.textContent = saved?.slots?.[index] || "";
    slot.disabled = Boolean(saved);
    if (slot.textContent) slot.classList.add("filled");
    slot.addEventListener("dragover", (event) => {
      event.preventDefault();
      slot.classList.add("active");
    });
    slot.addEventListener("dragleave", () => slot.classList.remove("active"));
    slot.addEventListener("drop", (event) => {
      event.preventDefault();
      slot.classList.remove("active");
      fillSlot(index, event.dataTransfer.getData("text/plain"));
    });
    line.append(slot);
  });
  line.append(document.createTextNode(q.pattern[q.answerSlots.length]));

  const bank = document.createElement("div");
  bank.className = "vowel-bank";
  q.pieces.forEach((piece, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "vowel";
    button.textContent = piece;
    button.draggable = !saved;
    button.disabled = Boolean(saved);
    button.dataset.piece = piece;
    button.dataset.pieceIndex = String(index);
    button.addEventListener("dragstart", (event) => event.dataTransfer.setData("text/plain", piece));
    button.addEventListener("click", () => fillFirstEmptySlot(piece));
    bank.appendChild(button);
  });

  const check = document.createElement("button");
  check.type = "button";
  check.className = "primary puzzle-check";
  check.textContent = "проверить";
  check.disabled = Boolean(saved);
  check.addEventListener("click", checkPuzzleAnswer);

  puzzle.append(line, bank, check);
  els.options.appendChild(puzzle);
}

function fillSlot(index, value) {
  if (state.locked || !value) return;
  const slot = els.options.querySelector(`[data-slot="${index}"]`);
  slot.textContent = value;
  slot.classList.add("filled");
}

function fillFirstEmptySlot(value) {
  if (state.locked) return;
  const emptySlot = [...els.options.querySelectorAll("[data-slot]")].find((slot) => !slot.textContent);
  if (!emptySlot) return;
  emptySlot.textContent = value;
  emptySlot.classList.add("filled");
}

function checkPuzzleAnswer() {
  if (state.locked) return;
  const q = questions[state.index];
  const slots = [...els.options.querySelectorAll("[data-slot]")].map((slot) => slot.textContent.trim());
  if (slots.some((slot) => !slot)) return;
  const isCorrect = slots.every((slot, index) => slot === q.answerSlots[index]);
  saveAnswer(slots.join(" "), isCorrect, { slots });
}

function saveAnswer(value, isCorrect, extra = {}) {
  const q = questions[state.index];
  state.answers[state.index] = { value, isCorrect, answer: q.answer, ...extra };
  state.locked = true;
  render();
}

function showSavedFeedback(q, saved) {
  els.feedback.hidden = false;
  els.feedback.className = `feedback ${saved.isCorrect ? "good" : "bad"}`;
  els.feedback.innerHTML = `<strong>${saved.isCorrect ? "Верно." : "Нужно: " + q.answer + "."}</strong> ${q.explain}`;
}

function checkTypedAnswer(event) {
  event.preventDefault();
  if (state.locked) return;
  const q = questions[state.index];
  const userAnswer = normalize(els.input.value);
  if (!userAnswer) return;
  saveAnswer(els.input.value.trim(), acceptedAnswers(q).includes(userAnswer));
}

function handleEnterNavigation(event) {
  if (event.key !== "Enter") return;
  if (!state.answers[state.index] && !els.form.hidden) {
    checkTypedAnswer(event);
    return;
  }
  if (!state.answers[state.index] || els.next.disabled) return;
  event.preventDefault();
  next();
}

function next() {
  if (!state.answers[state.index]) return;
  if (state.index === questions.length - 1) {
    showSummary();
    return;
  }
  state.index += 1;
  render();
}

function prev() {
  if (state.index === 0) return;
  state.index -= 1;
  render();
}

function showSummary() {
  updateStats();
  const percent = Math.round((state.score / questions.length) * 100);
  const message =
    percent >= 86
      ? "Отлично: stare, Come stai? и c'è / ci sono уже работают уверенно."
      : percent >= 66
        ? "База есть. Повтори отдельно формы stare и разницу c'è / ci sono."
        : "Лучше пройти еще раз медленно: сначала stare, затем Come stai?, затем c'è / ci sono.";
  els.summary.hidden = false;
  els.resultText.textContent = `Результат: ${state.score} из ${questions.length} (${percent}%). ${message}`;
  els.summary.scrollIntoView({ behavior: "smooth", block: "center" });
}

function restart() {
  state.index = 0;
  state.answers = Array(questions.length).fill(null);
  state.optionOrders = Array(questions.length).fill(null);
  state.score = 0;
  state.streak = 0;
  render();
}

els.next.addEventListener("click", next);
els.prev.addEventListener("click", prev);
els.restart.addEventListener("click", restart);
els.retry.addEventListener("click", restart);
els.form.addEventListener("submit", checkTypedAnswer);
document.addEventListener("keydown", handleEnterNavigation);

render();

    </script>
